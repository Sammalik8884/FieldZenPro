name: Keep Azure App Service Alive

on:
  schedule:
    # Runs every 15 minutes to prevent IIS worker process from going idle.
    # Azure App Service usually sleeps after 20 minutes of inactivity.
    - cron: '*/15 * * * *'
  # Allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure Web API
        # Pings the application to keep it awake.
        # It's recommended to ping a lightweight endpoint like /swagger/index.html or a custom /api/health
        run: |
          curl -sS https://mytecherpapi20260322094207-fnfwfsf5bshubmfs.francecentral-01.azurewebsites.net > /dev/null
          
      - name: Ping Azure Web Frontend (if applicable)
        # Assuming you also have a frontend hosted on Azure that needs keeping awake
        run: |
          curl -sS https://mytech-erp-drg7f9gqcxgahggv.austriaeast-01.azurewebsites.net > /dev/null
