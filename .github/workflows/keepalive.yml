name: Keep Azure App Service Alive

on:
  schedule:
    # Runs every 5 minutes (the most frequent interval GitHub Actions supports).
    # This prevents the Azure IIS worker process from ever going idle,
    # completely eliminating the 20-30 second cold start delay.
    - cron: '*/5 * * * *'
  # Allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure Web API
        # Pings the backend health endpoint to keep it awake.
        run: |
          curl -sS https://mytecherp-backend-69091.azurewebsites.net/api/health > /dev/null
          
      - name: Ping Vercel Frontend
        # Pings the frontend to keep serverless functions warm
        run: |
          curl -sS https://fieldzenpro.com > /dev/null
