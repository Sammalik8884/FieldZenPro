name: Build and deploy ASP.Net Core app to Azure Web App - mytecherp-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore backend/MytechERP.API/MytechERP.API.csproj

      - name: Build with dotnet
        run: dotnet build backend/MytechERP.API/MytechERP.API.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish backend/MytechERP.API/MytechERP.API.csproj -c Release -o ./publish_output

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mytecherp-backend-69091'
          package: ./publish_output
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}